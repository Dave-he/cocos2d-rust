[package]
name = "cocos2d-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.11.8"
glow = "0.13"
glutin = "0.31"
glutin-winit = "0.4"
image = "0.25.9"
log = "0.4.29"
plist = "1.7"
rand = "0.8"
raw-window-handle = "0.5"
regex = "1.10"
rodio = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
winit = "0.29"

[[example]]
name = "game_demo"
path = "examples/game_demo.rs"

[[example]]
name = "sprite_demo"
path = "examples/sprite_demo.rs"

[[example]]
name = "physics_demo"
path = "examples/physics_demo.rs"

[[example]]
name = "phase7_demo"
path = "examples/phase7_demo.rs"

